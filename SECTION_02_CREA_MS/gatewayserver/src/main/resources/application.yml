server:
  port: 8888
spring:
  application:
    name: gatewayserver
  cloud:
    config:
      enabled: false
    discovery:
      enabled: true
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: r1
              uri: lb://COULEUR
              predicates:
                - Path=/api/couleurs/**
            - id: r2
              uri: lb://ACCESSOIRE
              predicates:
                - Path=/api/accessoires/**
eureka:
  client:
    service-url:
      defaultZone: ${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    gateway:
      access: unrestricted